<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Footers · DesarrollAMO Design System</title>
  <link rel="stylesheet" href="../dist/footer.css" />
</head>
<body>
  <main class="amo-container amo-section amo-stack" data-gap="8">
    <h1 class="amo-heading">Footers oficiales</h1>
    <p class="amo-lead">Corporate para superficies propias; Attribution para trabajos de clientes.</p>
  </main>
  <footer class="amo-footer amo-footer--attribution">
    <a class="amo-footer__attribution" href="https://desarrollamo.com.ar/" target="_blank" rel="noopener noreferrer sponsored">
      <span class="amo-footer__credit">Desarrollado por</span>
      <img class="amo-footer__logo amo-footer__logo--compact" src="https://cdn.jsdelivr.net/gh/desarrollamo/branding@v1.3.0/assets/logo/horizontal.svg" alt="DesarrollAMO." />
    </a>
  </footer>
  <footer class="amo-footer amo-footer--corporate">
    <div class="amo-footer__inner">
      <a class="amo-footer__brand" href="https://desarrollamo.com.ar/"><img class="amo-footer__logo" src="https://cdn.jsdelivr.net/gh/desarrollamo/branding@v1.3.0/assets/logo/horizontal.svg" alt="DesarrollAMO." /></a>
      <span class="amo-footer__copyright">© 2026</span>
      <nav class="amo-footer__legal" aria-label="Enlaces legales y de ayuda">
        <a href="https://desarrollamo.com.ar/faq">FAQ</a><a href="https://desarrollamo.com.ar/terms">Términos</a><a href="https://desarrollamo.com.ar/privacy">Privacidad</a><a href="https://desarrollamo.com.ar/cookies">Cookies</a><a href="https://desarrollamo.com.ar/payments">Pagos</a><a href="https://desarrollamo.com.ar/licenses">Licencias</a>
      </nav>
    </div>
  </footer>
</body>
</html>
